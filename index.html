<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Тестов</title>
    <style>
        :root {
            --bg-color: #f0f3f6;
            --card-bg: #ffffff;
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --success: #2ecc71;
            --error: #e74c3c;
            --warning: #f39c12;
            --text: #2c3e50;
            --border: #dcdde1;
        }
        [data-theme="dark"] {
            --bg-color: #1e272e;
            --card-bg: #2f3640;
            --primary: #718093;
            --primary-hover: #718093cc;
            --text: #f5f6fa;
            --border: #71809344;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 680px;
            padding: 35px;
            box-sizing: border-box;
            position: relative;
            transition: background-color 0.3s;
        }
        h1, h2, h3 {
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }
        .theme-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 20px;
        }
        .theme-toggle-btn:hover {
            background: var(--border);
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        button:not(.theme-toggle-btn) {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        button:not(.theme-toggle-btn):hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        button.secondary {
            background-color: #95a5a6;
        }
        button.secondary:hover {
            background-color: #7f8c8d;
        }
        button.teacher-btn {
            background-color: #8e44ad;
        }
        button.teacher-btn:hover {
            background-color: #732d91;
        }
        button.danger-sm {
            background-color: var(--error);
            padding: 8px 12px;
            font-size: 14px;
        }
        .setting-item {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .setting-item label.main-label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .radio-stack, .row-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .row-group {
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
        }
        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .checkbox-group label, .radio-stack label, .row-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        .panel-box {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        select, input[type="text"].std-input {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 2px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text);
        }
        input[type="text"].code-input {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            font-size: 16px;
            font-family: monospace;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            border-radius: 8px;
            border: 2px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text);
            text-transform: uppercase;
        }
        .avg-pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            color: white;
            background: var(--primary);
        }
        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 6px;
        }
        .numerator {
            border-bottom: 3px solid var(--text);
            padding-bottom: 3px;
            font-size: 24px;
        }
        .denominator {
            padding-top: 3px;
            font-size: 24px;
        }
        .math-expr {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .answer-block {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .answer-block input {
            width: 140px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border: 2px solid var(--border);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text);
        }
        .answer-block input:focus {
            border-color: var(--primary);
            outline: none;
        }
        .answer-block .fraction input {
            width: 95px;
            padding: 8px;
            font-size: 18px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            background: var(--border);
            padding: 10px;
            border-radius: 8px;
        }
        .feedback {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            min-height: 30px;
            margin-bottom: 15px;
        }
        .grade-badge {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 44px;
            font-weight: bold;
            color: white;
            margin: 10px auto;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        .analytics-box {
            background: var(--bg-color);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .mistake-item {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            border-left: 4px solid var(--error);
            font-size: 14px;
        }
        .student-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .student-card:hover {
            transform: translateX(3px);
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle-btn" onclick="toggleTheme()">🌓 Тема</button>

        <!-- ТИТУЛЬНЫЙ ЭКРАН -->
        <div id="screen-main" class="screen active">
            <h1>Тренажер</h1>
            
            <div class="panel-box">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <label style="font-weight:700;">👤 Профиль ученика:</label>
                    <span id="student-avg-badge" class="avg-pill">Ср. балл: —</span>
                </div>
                <div class="flex-row" style="margin-bottom:10px;">
                    <select id="student-select" onchange="selectStudentProfile()"></select>
                    <button onclick="createNewStudentPrompt()" style="padding: 12px 15px;" title="Создать профиль">+</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                    <div style="font-size:13px; opacity:0.75;" id="student-tests-info">Пройдено тестов с оценкой: 0</div>
                    <button onclick="exportStudentSyncCode()" style="padding: 8px 12px; font-size:13px; background-color:#2c3e50;">Код моих оценок</button>
                </div>
            </div>

            <div class="panel-box">
                <label style="display:block; font-weight:700; margin-bottom:8px;">Загрузить пресет по коду:</label>
                <div class="flex-row">
                    <input type="text" id="import-code-input" class="code-input" placeholder="Например: E-1-3-0-0-0">
                    <button onclick="importPresetCode()" style="padding: 12px 18px;">Загрузить</button>
                </div>
            </div>

            <div class="btn-group">
                <button onclick="switchScreen('screen-quiz'); startQuiz();">Решать тест</button>
                <button class="secondary" onclick="switchScreen('screen-settings')">Настройки параметров</button>
                <button class="teacher-btn" onclick="openTeacherPortal()">Кабинет учителя</button>
            </div>
        </div>

        <!-- КАБИНЕТ УЧИТЕЛЯ -->
        <div id="screen-teacher" class="screen">
            <h2>Журнал класса</h2>
            <div class="panel-box">
                <label style="display:block; font-weight:700; margin-bottom:8px;">Выбор или создание класса:</label>
                <div class="flex-row" style="margin-bottom:10px;">
                    <select id="teacher-class-select" onchange="selectTeacherClass()"></select>
                    <button onclick="createNewClassPrompt()" style="padding: 12px 14px; font-size:14px;">+ Класс</button>
                    <button class="danger-sm" onclick="deleteCurrentClass()" style="padding: 12px 14px;">Удалить класс</button>
                </div>
                <label style="display:block; font-weight:700; margin-bottom:8px; margin-top:12px;">Добавить учеников в класс по фамилии (каждый с новой строки):</label>
                <textarea id="teacher-new-student" class="std-input" rows="3" style="width:100%; box-sizing:border-box; margin-bottom:10px; font-family:inherit; resize:vertical;" placeholder="Андреев&#10;Иванов&#10;Петрова"></textarea>
                <div class="flex-row">
                    <button onclick="addStudentToClassBySurname()" style="flex:1; padding: 12px 14px;">Добавить в класс по фамилии</button>
                    <button onclick="importStudentSyncCode()" style="padding: 12px 14px; background-color:#2c3e50;">Загрузить код ученика</button>
                </div>
            </div>
            
            <div id="class-roster-container" class="analytics-box" style="max-height: 290px;"></div>
            
            <div id="student-detail-modal" class="panel-box" style="display:none; margin-top:15px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 id="detail-student-name" style="margin:0; font-size:18px;"></h3>
                    <button class="danger-sm" onclick="removeStudentFromClass()">Убрать из класса</button>
                </div>
                <div id="detail-student-history" style="max-height:170px; overflow-y:auto; font-size:14px;"></div>
            </div>

            <div class="btn-group">
                <button class="secondary" onclick="switchScreen('screen-main')">Выйти из кабинета учителя</button>
            </div>
        </div>
        <!-- ЭКРАН НАСТРОЕК -->
        <div id="screen-settings" class="screen">
            <h2>Настройки параметров</h2>
            <div class="panel-box">
                <label style="display:block; font-weight:700; margin-bottom:8px;">Код твоих текущих настроек (для переноса):</label>
                <div class="flex-row">
                    <input type="text" id="export-code-output" class="code-input" readonly placeholder="Нажми 'Создать код'">
                    <button onclick="generatePresetCode()" style="padding: 12px 14px;">Создать код</button>
                    <button onclick="copyPresetLink()" style="padding: 12px 14px; background-color: var(--success);">Скопировать ссылку</button>
                </div>
            </div>
            <div class="setting-item">
                <label class="main-label">Уровень сложности:</label>
                <div class="row-group">
                    <label><input type="radio" name="difficulty" value="easy" checked>🟢 Легкий</label>
                    <label><input type="radio" name="difficulty" value="medium">🟡 Средний</label>
                    <label><input type="radio" name="difficulty" value="hard">🔴 Сложный</label>
                </div>
            </div>
            <div class="setting-item">
                <label class="main-label">Выберите темы (можно несколько):</label>
                <div class="radio-stack">
                    <label><input type="checkbox" class="theme-cb" value="integers" checked> 🔢 Целые числа</label>
                    <label><input type="checkbox" class="theme-cb" value="fractions"> 🥞 Обыкновенные дроби</label>
                    <label><input type="checkbox" class="theme-cb" value="decimals"> 🔍 Десятичные дроби</label>
                    <label><input type="checkbox" class="theme-cb" value="equations"> 📐 Простые уравнения</label>
                    <label><input type="checkbox" class="theme-cb" value="percents"> 📊 Проценты от чисел</label>
                    <label><input type="checkbox" class="theme-cb" value="squares"> 📈 Квадраты чисел</label>
                    <label><input type="checkbox" class="theme-cb" value="cubes"> 🧊 Кубы чисел</label>
                    <label><input type="checkbox" class="theme-cb" value="area"> 🔲 Площадь фигур</label>
                    <label><input type="checkbox" class="theme-cb" value="compare"> 🎲 Сравнение чисел (&lt;, &gt;, =)</label>
                    <label><input type="checkbox" class="theme-cb" value="oge"> 📋 Задания ОГЭ (Облегченные)</label>
                    <label><input type="checkbox" class="theme-cb" value="average"> 📈 Среднее арифметическое</label>
                    <label><input type="checkbox" class="theme-cb" value="round"> 🔄 Округление чисел</label>
                    <label><input type="checkbox" class="theme-cb" value="powers"> 🔋 Свойства степеней (ОГЭ)</label>
                    <label><input type="checkbox" class="theme-cb" value="probability"> 🎲 Простые вероятности</label>
                    <label><input type="checkbox" class="theme-cb" value="gcdlcm"> 🧬 Поиск НОД и НОК</label>
                    <label><input type="checkbox" class="theme-cb" value="angles"> 📐 Градусы и углы</label>
                </div>
            </div>
            <div class="setting-item">
                <label class="main-label">Доступные знаки (для базовых тем):</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="op-add" checked> Сложение (+)</label>
                    <label><input type="checkbox" id="op-sub" checked> Вычитание (-)</label>
                    <label><input type="checkbox" id="op-mul"> Умножение (×</label>
                    <label><input type="checkbox" id="op-div"> Деление (÷)</label>
                </div>
            </div>
            <div class="setting-item">
                <label class="main-label">Ограничение по времени:</label>
                <div class="row-group">
                    <label><input type="radio" name="timer-opt" value="off" checked> Без таймера</label>
                    <label><input type="radio" name="timer-opt" value="15"> 15 сек</label>
                    <label><input type="radio" name="timer-opt" value="30"> 30 сек</label>
                    <label><input type="radio" name="timer-opt" value="60"> 60 сек</label>
                </div>
            </div>
            <div class="setting-item">
                <label class="main-label">Длина теста (вопросов):</label>
                <div class="row-group">
                    <label><input type="radio" name="length-opt" value="inf" checked> Бесконечно</label>
                    <label><input type="radio" name="length-opt" value="5"> 5 (на оценку)</label>
                    <label><input type="radio" name="length-opt" value="10"> 10 (на оценку)</label>
                    <label><input type="radio" name="length-opt" value="20"> 20 (на оценку)</label>
                </div>
            </div>
            <div class="setting-item">
                <label class="main-label">Дополнительные опции:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="force-reduce"> Требовать сокращения дробей</label>
                    <label><input type="checkbox" id="allow-negative"> Разрешить отрицательные числа</label>
                </div>
            </div>
            <div class="btn-group">
                <button onclick="saveAndExitSettings()">Применить и вернуться</button>
            </div>
        </div>
        <!-- ЭКРАН РЕШЕНИЯ ТЕСТА -->
        <div id="screen-quiz" class="screen">
            <h2>Решение примеров</h2>
            <div class="score-board">
                <div>Ученик: <span id="quiz-student-name">Гость</span></div>
                <div>Вопрос: <span id="quest-count">0</span></div>
                <div>Таймер: <span id="timer-display">--</span></div>
                <div>Верно: <span id="score-count">0</span></div>
            </div>
            <div id="math-question" class="math-expr"></div>
            <div id="input-container" class="answer-block"></div>
            <div class="feedback" id="feedback-message"></div>
            <div class="btn-group">
                <button id="btn-action" onclick="checkAnswer()">Проверить ответ</button>
                <button class="secondary" onclick="exitQuiz()">Выйти</button>
            </div>
        </div>

        <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
        <div id="screen-results" class="screen">
            <h2>Тест завершен!</h2>
            <div id="grade-badge" class="grade-badge">5</div>
            <h3 id="final-stats" style="margin: 10px 0; font-size: 20px;"></h3>
            <div id="analytics-container" class="analytics-box"></div>
            <div class="btn-group">
                <button onclick="switchScreen('screen-main')">На главную страницу</button>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('math_trainer_theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('math_trainer_theme', 'dark');
            }
        }
        if (localStorage.getItem('math_trainer_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        let currentAnswer = {};
        let score = 0;
        let questionNumber = 0;
        let maxQuestions = Infinity;
        let isAnswerChecked = false;
        let timerInterval = null;
        let timeLeft = 0;
        let currentThemeKey = 'integers';
        let currentQuestionText = '';
        let sessionStats = {};
        let sessionMistakes = [];

        let classData = {
            activeId: '',
            students: [],
            activeClassId: 'cls_default',
            classes: [
                { id: 'cls_default', name: '7А', studentIds: [] }
            ]
        };
        let inspectedStudentId = null;

        const themeNames = {
            integers: 'Целые числа',
            fractions: 'Обыкновенные дроби',
            decimals: 'Десятичные дроби',
            equations: 'Простые уравнения',
            percents: 'Проценты от чисел',
            squares: 'Квадраты чисел',
            cubes: 'Кубы чисел',
            area: 'Площадь фигур',
            compare: 'Сравнение чисел',
            oge: 'Задания ОГЭ',
            average: 'Среднее арифметическое',
            round: 'Округление чисел',
            powers: 'Свойства степеней',
            probability: 'Простые вероятности',
            gcdlcm: 'Поиск НОД и НОК',
            angles: 'Градусы и углы'
        };

        function loadClassData() {
            const raw = localStorage.getItem('math_trainer_class_v2');
            let loaded = false;
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (parsed && Array.isArray(parsed.students) && parsed.students.length > 0) {
                        classData = parsed;
                        if (!Array.isArray(classData.classes) || classData.classes.length === 0) {
                            classData.classes = [{ id: 'cls_default', name: '7А', studentIds: [] }];
                            classData.activeClassId = 'cls_default';
                        }
                        loaded = true;
                    }
                } catch (e) {}
            }
            if (!loaded) {
                const enteredName = prompt("Добро пожаловать! Введите вашу фамилию и имя (например: Андреев Даниил):");
                const finalName = (enteredName && enteredName.trim()) ? enteredName.trim() : "Ученик";
                const firstId = 'st_' + Date.now();
                classData = {
                    activeId: firstId,
                    students: [{ id: firstId, name: finalName, history: [] }],
                    activeClassId: 'cls_default',
                    classes: [{ id: 'cls_default', name: '7А', studentIds: [] }]
                };
                localStorage.setItem('math_trainer_class_v2', JSON.stringify(classData));
            }
            updateStudentUI();
        }

        function saveClassData() {
            localStorage.setItem('math_trainer_class_v2', JSON.stringify(classData));
            updateStudentUI();
        }

        function getStudentAvg(student) {
            if (!student.history || student.history.length === 0) return null;
            const sum = student.history.reduce((acc, item) => acc + item.grade, 0);
            return (sum / student.history.length).toFixed(2);
        }

        function getAvgColor(avg) {
            if (avg === null) return '#95a5a6';
            const val = parseFloat(avg);
            if (val >= 4.5) return 'var(--success)';
            if (val >= 3.5) return '#3498db';
            if (val >= 2.5) return 'var(--warning)';
            return 'var(--error)';
        }

        function updateStudentUI() {
            const select = document.getElementById('student-select');
            select.innerHTML = '';
            classData.students.forEach(st => {
                const opt = document.createElement('option');
                opt.value = st.id;
                opt.innerText = st.name;
                select.appendChild(opt);
            });
            select.value = classData.activeId;

            const activeSt = classData.students.find(s => s.id === classData.activeId) || classData.students.at(0);
            classData.activeId = activeSt.id;
            const avg = getStudentAvg(activeSt);
            const badge = document.getElementById('student-avg-badge');
            badge.innerText = avg ? `Ср. балл: ${avg}` : 'Ср. балл: —';
            badge.style.backgroundColor = getAvgColor(avg);

        function buildCurrentCodeString() {
            const diffMap = { easy: 'E', medium: 'M', hard: 'H' };
            const diff = diffMap[document.querySelector('input[name="difficulty"]:checked').value];

            let themeMask = 0;
            document.querySelectorAll('.theme-cb').forEach((cb, index) => {
                if (cb.checked) themeMask |= (1 << index);
            });
            if (themeMask === 0) return null;

            let opMask = 0;
            if (document.getElementById('op-add').checked) opMask |= 1;
            if (document.getElementById('op-sub').checked) opMask |= 2;
            if (document.getElementById('op-mul').checked) opMask |= 4;
            if (document.getElementById('op-div').checked) opMask |= 8;

            const timerMap = { off: '0', '15': '1', '30': '2', '60': '3' };
            const timer = timerMap[document.querySelector('input[name="timer-opt"]:checked').value];

            const lenMap = { inf: '0', '5': '1', '10': '2', '20': '3' };
            const len = lenMap[document.querySelector('input[name="length-opt"]:checked').value];

            let extraMask = 0;
            if (document.getElementById('force-reduce').checked) extraMask |= 1;
            if (document.getElementById('allow-negative').checked) extraMask |= 2;

            return `${diff}-${themeMask.toString(36).toUpperCase()}-${opMask.toString(16).toUpperCase()}-${timer}-${len}-${extraMask}`;
        }

        function applyCodeString(rawCode, silent) {
            if (!rawCode) return false;
            let clean = decodeURIComponent(rawCode).trim();
            if (clean.includes('#')) {
                clean = clean.split('#').pop();
            }
            const raw = clean.trim().toUpperCase();
            if (!raw) return false;
            const parts = raw.split('-');
            if (parts.length !== 6) {
                if (!silent) alert("Неверный формат кода! Проверьте символы и дефисы.");
                return false;
            }

            const [pDiff, pTheme, pOp, pTimer, pLen, pExtra] = parts;
            const diffRev = { E: 'easy', M: 'medium', H: 'hard' };
            const timerRev = { '0': 'off', '1': '15', '2': '30', '3': '60' };
            const lenRev = { '0': 'inf', '1': '5', '2': '10', '3': '20' };

            const diffVal = diffRev[pDiff];
            const themeMask = parseInt(pTheme, 36);
            const opMask = parseInt(pOp, 16);
            const timerVal = timerRev[pTimer];
            const lenVal = lenRev[pLen];
            const extraMask = parseInt(pExtra, 10);

            if (!diffVal || isNaN(themeMask) || isNaN(opMask) || !timerVal || !lenVal || isNaN(extraMask)) {
                if (!silent) alert("Код поврежден или содержит ошибку!");
                return false;
            }

            document.querySelector(`input[name="difficulty"][value="${diffVal}"]`).checked = true;
            document.querySelectorAll('.theme-cb').forEach((cb, index) => {
                cb.checked = Boolean(themeMask & (1 << index));
            });
            document.getElementById('op-add').checked = Boolean(opMask & 1);
            document.getElementById('op-sub').checked = Boolean(opMask & 2);
            document.getElementById('op-mul').checked = Boolean(opMask & 4);
            document.getElementById('op-div').checked = Boolean(opMask & 8);
            document.querySelector(`input[name="timer-opt"][value="${timerVal}"]`).checked = true;
            document.querySelector(`input[name="length-opt"][value="${lenVal}"]`).checked = true;
            document.getElementById('force-reduce').checked = Boolean(extraMask & 1);
            document.getElementById('allow-negative').checked = Boolean(extraMask & 2);
            document.getElementById('import-code-input').value = raw;
            return true;
        }

            if (!raw.trim()) {

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        function gcd(a, b) {
            return b ? gcd(b, a % b) : Math.abs(a);
        }
        function findLCM(a, b) {
            return (a * b) / gcd(a, b);
        }

        function startQuiz() {
            score = 0;
            questionNumber = 0;
            sessionStats = {};
            sessionMistakes = [];

        function getSelectedOperation() {
            let ops = [];
            if(document.getElementById('op-add').checked) ops.push('+');
            if(document.getElementById('op-sub').checked) ops.push('-');
            if(document.getElementById('op-mul').checked) ops.push('*');
            if(document.getElementById('op-div').checked) ops.push('/');
            if(ops.length === 0) ops = ['+'];
            return ops.at(Math.floor(Math.random() * ops.length));
        }
        function startTimer() {
            clearInterval(timerInterval);
            const timerOpt = document.querySelector('input[name="timer-opt"]:checked').value;
            if (timerOpt === 'off') {
                document.getElementById('timer-display').innerText = '--';
                return;
            }
            timeLeft = parseInt(timerOpt);
            document.getElementById('timer-display').innerText = timeLeft + 'с';
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft + 'с';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }
        function getCorrectAnswerStr() {
            const forceReduce = document.getElementById('force-reduce').checked;
            if (currentAnswer.type === 'single' || currentAnswer.type === 'text') {
                return currentAnswer.val;
            } else {
                let reqNum = currentAnswer.num;
                let reqDen = currentAnswer.den;
                if (reqDen < 0) { reqNum = -reqNum; reqDen = -reqDen; }
                if (forceReduce) {
                    const d = gcd(reqNum, reqDen);
                    return `${reqNum / d}/${reqDen / d}`;
                }
                return `${reqNum}/${reqDen}`;
            }
        }
        function recordAttempt(isCorrect, userStr) {
            if (!sessionStats[currentThemeKey]) {
                sessionStats[currentThemeKey] = { total: 0, correct: 0 };
            }
            sessionStats[currentThemeKey].total++;
            if (isCorrect) {
                sessionStats[currentThemeKey].correct++;
            } else {
                sessionMistakes.push({
                    theme: themeNames[currentThemeKey] || currentThemeKey,
                    question: currentQuestionText,

        function showResultsScreen() {
            const percent = Math.round((score / maxQuestions) * 100);
            let grade = 2;
            let color = "var(--error)";

            else if (percent >= 50) { grade = 3; color = "var(--warning)"; }

            const activeSt = classData.students.find(s => s.id === classData.activeId);
            if (activeSt) {
                const now = new Date();
                const dateStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
                const usedThemes = Object.keys(sessionStats).map(k => themeNames[k] || k).join(', ');
                activeSt.history.push({
                    date: dateStr,
                    grade: grade,
                    score: score,
                    total: maxQuestions,
                    percent: percent,
                    themes: usedThemes
                });
                saveClassData();
            }

            const badge = document.getElementById('grade-badge');
            badge.innerText = grade;
            badge.style.backgroundColor = color;
            document.getElementById('final-stats').innerText = `Верно: ${score} из ${maxQuestions} (${percent}%)`;

            let html = '<div style="font-weight:700; margin-bottom:8px;">📊 Статистика по темам:</div>';
            for (const [key, data] of Object.entries(sessionStats)) {
                const name = themeNames[key] || key;

                html += `<div class="stat-row"><span>${name}</span><span style="font-weight:bold; color:${statusColor};">${data.correct} из ${data.total}</span></div>`;
            }

            if (sessionMistakes.length > 0) {
                html += '<div style="font-weight:700; margin-top:15px; margin-bottom:6px; color:var(--error);">❌ Разбор ошибок:</div>';
                sessionMistakes.forEach(m => {
                    html += `<div class="mistake-item"><b>${m.theme}:</b> ${m.question}<br>Ваш ответ: <span style="color:var(--error);">${m.user}</span> | Правильно: <span style="color:var(--success); font-weight:bold;">${m.correct}</span></div>`;
                });
            } else {
                html += '<div style="text-align:center; color:var(--success); font-weight:bold; margin-top:15px;">Идеально! Ошибок нет.</div>';
            }

            document.getElementById('analytics-container').innerHTML = html;
            try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch(e) {}
            switchScreen('screen-results');
        }
        function generateProblem() {
            clearInterval(timerInterval);
            questionNumber++;
            if (questionNumber > maxQuestions) {
                showResultsScreen();
                return;
            }
            document.getElementById('quest-count').innerText = maxQuestions === Infinity ? questionNumber : `${questionNumber}/${maxQuestions}`;
            isAnswerChecked = false;
            document.getElementById('feedback-message').innerText = '';
            document.getElementById('btn-action').innerText = 'Проверить ответ';
            
            let checkedThemes = [];
            document.querySelectorAll('.theme-cb:checked').forEach(cb => checkedThemes.push(cb.value));
            if (checkedThemes.length === 0) checkedThemes = ['integers'];
            const theme = checkedThemes.at(Math.floor(Math.random() * checkedThemes.length));
            currentThemeKey = theme;
            const diff = document.querySelector('input[name="difficulty"]:checked').value;
            const op = getSelectedOperation();
            let opSign = op === '*' ? '×' : op === '/' ? '÷' : op;
            const allowNeg = document.getElementById('allow-negative').checked;
            const qContainer = document.getElementById('math-question');
            const iContainer = document.getElementById('input-container');
            qContainer.innerHTML = ''; iContainer.innerHTML = '';
            let minRange = 1, maxRange = 10, maxDen = 4;
            if (diff === 'medium') { minRange = 10; maxRange = 50; maxDen = 8; }
            if (diff === 'hard') { minRange = 30; maxRange = 150; maxDen = 15; }
            startTimer();
            if (theme === 'integers') {
                let n1, n2, ans;
                if (op === '/') {
                    n2 = getRandomInt(diff === 'easy' ? 2 : 5, diff === 'easy' ? 9 : 20);
                    ans = getRandomInt(minRange, diff === 'hard' ? 30 : 10);
                    n1 = n2 * ans;
                } else {
                    n1 = getRandomInt(minRange, maxRange);
                    n2 = getRandomInt(diff === 'easy' ? 1 : 5, diff === 'easy' ? 10 : 40);
                    if (op === '*' && diff === 'hard') { n1 = getRandomInt(10, 50); n2 = getRandomInt(5, 15); }
                    if (op === '-' && n1 < n2 && !allowNeg) [n1, n2] = [n2, n1];
                    ans = op === '+' ? n1 + n2 : op === '-' ? n1 - n2 : n1 * n2;
                }
                currentQuestionText = `${n1} ${opSign} ${n2}`;
                qContainer.innerHTML = `${currentQuestionText} =`;
                iContainer.innerHTML = `<input type="number" id="ans-single" placeholder="?">`;
                currentAnswer = { type: 'single', val: ans };
            } 
            else if (theme === 'fractions') {
                let num1 = getRandomInt(1, maxDen - 1), den1 = getRandomInt(2, maxDen);
                let num2 = getRandomInt(1, maxDen - 1), den2 = getRandomInt(2, maxDen);
                if (op === '/' && num2 === 0) num2 = 1;
                if (op === '-' && (num1/den1 < num2/den2) && !allowNeg) { [num1, num2] = [num2, num1]; [den1, den2] = [den2, den1]; }
                currentQuestionText = `${num1}/${den1} ${opSign} ${num2}/${den2}`;
                qContainer.innerHTML = `<div class="fraction"><span class="numerator">${num1}</span><span class="denominator">${den1}</span></div> <span>${opSign}</span> <div class="fraction"><span class="numerator">${num2}</span><span class="denominator">${den2}</span></div> <span>=</span>`;
                iContainer.innerHTML = `<div class="fraction"><input type="number" id="ans-num" placeholder="Числ." required><span style="border-bottom: 2px solid var(--text); width: 100%; margin: 4px 0;"></span><input type="number" id="ans-den" placeholder="Знам." required></div>`;
                let rNum, rDen;
                if(op === '+') { rNum = num1*den2 + num2*den1; rDen = den1*den2; }
                if(op === '-') { rNum = num1*den2 - num2*den1; rDen = den1*den2; }
                if(op === '*') { rNum = num1*num2; rDen = den1*den2; }
                if(op === '/') { rNum = num1*den2; rDen = den1*num2; }
                currentAnswer = { type: 'frac', num: rNum, den: rDen };
            } 
            else if (theme === 'decimals') {
                let factor = diff === 'easy' ? 10 : 100;
                let n1 = (getRandomInt(minRange * 2, maxRange * 2) / factor);
                let n2 = (getRandomInt(5, maxRange) / factor);
                if (op === '/' && n2 === 0) n2 = 1;
                if (op === '-' && n1 < n2 && !allowNeg) [n1, n2] = [n2, n1];
                let precision = diff === 'easy' ? 1 : 2;
                currentQuestionText = `${n1.toFixed(precision)} ${opSign} ${n2.toFixed(precision)}`;
                qContainer.innerHTML = `${currentQuestionText} =`;
                iContainer.innerHTML = `<input type="number" step="0.001" id="ans-single" placeholder="?">`;
                let ans = op === '+' ? n1 + n2 : op === '-' ? n1 - n2 : op === '*' ? n1 * n2 : n1 / n2;
                currentAnswer = { type: 'single', val: parseFloat(ans.toFixed(precision + 1)) };
            } 
            else if (theme === 'equations') {
                let x = getRandomInt(minRange, maxRange);
                if (getRandomInt(0, 1) === 1 && allowNeg) x = -x;
                let num = getRandomInt(diff === 'easy' ? 2 : 10, maxRange);
                let result = op === '+' ? x + num : op === '-' ? x - num : op === '*' ? x * num : parseFloat((x / num).toFixed(2));
                currentQuestionText = `X ${opSign} ${num} = ${result}`;
                qContainer.innerHTML = currentQuestionText;
                iContainer.innerHTML = `<span>X =</span><input type="number" step="0.01" id="ans-single" placeholder="?">`;
                currentAnswer = { type: 'single', val: x };
            }
            else if (theme === 'percents') {
                let percent = 5;
                if (diff === 'medium') percent = getRandomInt(1, 9) * 10;
                if (diff === 'hard') percent = getRandomInt(3, 95);
                let base = getRandomInt(10, 50) * 10;
                currentQuestionText = `Найти ${percent}% от ${base}`;
                qContainer.innerHTML = `${currentQuestionText} =`;
                iContainer.innerHTML = `<input type="number" step="0.01" id="ans-single" placeholder="?">`;
                currentAnswer = { type: 'single', val: parseFloat(((percent * base) / 100).toFixed(2)) };
            }
            else if (theme === 'squares') {
                let num = getRandomInt(2, diff === 'easy' ? 10 : diff === 'medium' ? 20 : 30);
                currentQuestionText = `${num}²`;
                qContainer.innerHTML = `${currentQuestionText} =`;
                iContainer.innerHTML = `<input type="number" id="ans-single" placeholder="?">`;
                currentAnswer = { type: 'single', val: num * num };
            }
            else if (theme === 'cubes') {
                let num = getRandomInt(2, diff === 'easy' ? 5 : diff === 'medium' ? 10 : 15);
                currentQuestionText = `${num}³`;
                qContainer.innerHTML = `${currentQuestionText} =`;
                iContainer.innerHTML = `<input type="number" id="ans-single" placeholder="?">`;
                currentAnswer = { type: 'single', val: num * num * num };
            }
            else if (theme === 'area') {
                let side1 = getRandomInt(2, diff === 'easy' ? 10 : 25);
                let side2 = getRandomInt(2, diff === 'easy' ? 10 : 25);
                if (getRandomInt(0, 1) === 1) {
                    currentQuestionText = `Площадь квадрата со стороной ${side1}`;
                    currentAnswer = { type: 'single', val: side1 * side1 };
                } else {
                    currentQuestionText = `Площадь прямоугольника ${side1} × ${side2}`;
                    currentAnswer = { type: 'single', val: side1 * side2 };
                }
                qContainer.innerHTML = `${currentQuestionText} =`;
                iContainer.innerHTML = `<input type="number" id="ans-single" placeholder="S = ?">`;
            }
            else if (theme === 'compare') {
                let n1 = getRandomInt(minRange, maxRange);
                let n2 = getRandomInt(minRange, maxRange);
                if (getRandomInt(0, 2) === 1) n1 = n2; 
                currentQuestionText = `Сравните числа: ${n1} и ${n2}`;
                qContainer.innerHTML = `Сравните числа: ${n1} [ ? ] ${n2}`;
                iContainer.innerHTML = `<input type="text" id="ans-text" placeholder=">, < или =" style="width:140px;">`;
                let ans = n1 > n2 ? '>' : n1 < n2 ? '<' : '=';
                currentAnswer = { type: 'text', val: ans };
            }
            else if (theme === 'oge') {
                let mode = getRandomInt(1, 2);
                if (mode === 1) {
                    let mult = getRandomInt(2, 6), den1 = getRandomInt(2, 4), num1 = 1;
                    let den2 = den1 * mult, num2 = getRandomInt(1, 3), ext = den2;
                    currentQuestionText = `(${num1}/${den1} + ${num2}/${den2}) × ${ext}`;
                    qContainer.innerHTML = `( <div class="fraction"><span class="numerator">${num1}</span><span class="denominator">${den1}</span></div> + <div class="fraction"><span class="numerator">${num2}</span><span class="denominator">${den2}</span></div> ) × ${ext} =`;
                    let ans = ((num1 * mult + num2) / den2) * ext;
                    iContainer.innerHTML = `<input type="number" id="ans-single" placeholder="?">`;
                    currentAnswer = { type: 'single', val: Math.round(ans) };
                } else {
                    let d1 = (getRandomInt(11, 39) / 10), d2 = getRandomInt(2, 5), d3 = (getRandomInt(10, 49) / 10);
                    currentQuestionText = `${d1.toFixed(1)} × ${d2} + ${d3.toFixed(1)}`;
                    qContainer.innerHTML = `${currentQuestionText} =`;
                    let ans = d1 * d2 + d3;
                    iContainer.innerHTML = `<input type="number" step="0.1" id="ans-single" placeholder="?">`;
                    currentAnswer = { type: 'single', val: parseFloat(ans.toFixed(1)) };
                }
            }
            else if (theme === 'average') {
                let count = getRandomInt(2, diff === 'easy' ? 2 : 3);
                let n1 = getRandomInt(2, maxRange), n2 = getRandomInt(2, maxRange), n3 = getRandomInt(2, maxRange);
                if (count === 2) {
                    if ((n1 + n2) % 2 !== 0) n1++;
                    currentQuestionText = `Среднее арифм. ${n1} и ${n2}`;
                    currentAnswer = { type: 'single', val: (n1 + n2) / 2 };
                } else {
                    while ((n1 + n2 + n3) % 3 !== 0) n1++;
                    currentQuestionText = `Среднее арифм. ${n1}, ${n2} и ${n3}`;
                    currentAnswer = { type: 'single', val: (n1 + n2 + n3) / 3 };
                }
                qContainer.innerHTML = `${currentQuestionText} =`;
                iContainer.innerHTML = `<input type="number" id="ans-single" placeholder="?">`;
            }
            else if (theme === 'round') {
                let num = getRandomInt(105, 995) / 100;
                let mode = getRandomInt(1, 2);
                if (mode === 1) {
                    currentQuestionText = `Округлите ${num.toFixed(2)} до целых`;
                    currentAnswer = { type: 'single', val: Math.round(num) };
                } else {
                    currentQuestionText = `Округлите ${num.toFixed(2)} до десятых`;
                    currentAnswer = { type: 'single', val: parseFloat(num.toFixed(1)) };
                }
                qContainer.innerHTML = `${currentQuestionText} =`;
                iContainer.innerHTML = `<input type="number" step="0.1" id="ans-single" placeholder="?">`;
            }
            else if (theme === 'powers') {
                let base = getRandomInt(2, 5);
                let p1 = getRandomInt(3, 6), p2 = getRandomInt(2, 4), p3 = getRandomInt(3, p1 + p2 - 1);
                currentQuestionText = `(${base}^${p1} × ${base}^${p2}) / ${base}^${p3}`;
                qContainer.innerHTML = `<div class="fraction"><span class="numerator">${base}<sup>${p1}</sup> × ${base}<sup>${p2}</sup></span><span class="denominator">${base}<sup>${p3}</sup></span></div> =`;
                iContainer.innerHTML = `<input type="number" id="ans-single" placeholder="?">`;
                currentAnswer = { type: 'single', val: Math.pow(base, (p1 + p2 - p3)) };
            }
            else if (theme === 'probability') {
                let total = diff === 'easy' ? 4 : diff === 'medium' ? 20 : 50;
                let favorable = getRandomInt(1, total - 1);
                currentQuestionText = `Вероятность (${favorable} из ${total} шаров)`;
                qContainer.innerHTML = `В коробке ${total} шаров, из них ${favorable} красных. Какова вероятность вытащить красный шар? (в виде дес. дроби)`;
                iContainer.innerHTML = `<input type="number" step="0.01" id="ans-single" placeholder="?">`;
                currentAnswer = { type: 'single', val: parseFloat((favorable / total).toFixed(2)) };
            }
            else if (theme === 'gcdlcm') {
                let mode = getRandomInt(1, 2);
                let n1 = getRandomInt(4, 15) * 2, n2 = getRandomInt(4, 15) * 2;
                while(n1 === n2) { n2 = getRandomInt(4, 15) * 2; }
                if (mode === 1) {
                    currentQuestionText = `НОД(${n1}; ${n2})`;
                    currentAnswer = { type: 'single', val: gcd(n1, n2) };
                } else {
                    currentQuestionText = `НОК(${n1}; ${n2})`;
                    currentAnswer = { type: 'single', val: findLCM(n1, n2) };
                }
                qContainer.innerHTML = `Найдите ${currentQuestionText} =`;
                iContainer.innerHTML = `<input type="number" id="ans-single" placeholder="?">`;
            }
            else if (theme === 'angles') {
                let angle = getRandomInt(20, 160);
                currentQuestionText = `Смежный угол к ${angle}°`;
                qContainer.innerHTML = `Один из смежных углов равен ${angle}°. Найдите второй угол =`;
                iContainer.innerHTML = `<input type="number" id="ans-single" placeholder="°">`;
                currentAnswer = { type: 'single', val: 180 - angle };
            }
        }
        function checkAnswer() {
            if (isAnswerChecked) { generateProblem(); return; }
            clearInterval(timerInterval);
            let isCorrect = false;
            let userDisplayStr = "";
            const feedback = document.getElementById('feedback-message');
            const forceReduce = document.getElementById('force-reduce').checked;
            if (currentAnswer.type === 'single') {
                const rawVal = document.getElementById('ans-single').value;
                userDisplayStr = rawVal === "" ? "пусто" : rawVal;
                const userAns = parseFloat(rawVal);
                if (Math.abs(userAns - currentAnswer.val) < 0.01) isCorrect = true;
            } else if (currentAnswer.type === 'text') {
                const userAns = document.getElementById('ans-text').value.trim();
                userDisplayStr = userAns === "" ? "пусто" : userAns;
                if (userAns === currentAnswer.val) isCorrect = true;
            } else if (currentAnswer.type === 'frac') {
                const rawN = document.getElementById('ans-num').value;
                const rawD = document.getElementById('ans-den').value;
                userDisplayStr = (rawN === "" || rawD === "") ? "пусто" : `${rawN}/${rawD}`;
                const uNum = parseInt(rawN);
                const uDen = parseInt(rawD);
                if (uDen !== 0 && !isNaN(uNum) && !isNaN(uDen)) {
                    let reqNum = currentAnswer.num; let reqDen = currentAnswer.den;
                    if (reqDen < 0) { reqNum = -reqNum; reqDen = -reqDen; }
                    if (forceReduce) {
                        const d = gcd(reqNum, reqDen);
                        if (uNum === (reqNum / d) && uDen === (reqDen / d)) isCorrect = true;
                    } else { if (uNum * reqDen === reqNum * uDen) isCorrect = true; }
                }
            }
            recordAttempt(isCorrect, userDisplayStr);
                       if (isCorrect) {
                feedback.innerText = "Правильно!"; feedback.style.color = "var(--success)"; score++;
            } else {
                feedback.innerText = `Ошибка! Правильно: ${getCorrectAnswerStr()}`; feedback.style.color = "var(--error)"; 
                if (maxQuestions === Infinity) score = 0;
            }
            document.getElementById('score-count').innerText = score;
            document.getElementById('btn-action').innerText = 'Следующий пример';
            isAnswerChecked = true;
        }
        window.onload = function() {
            loadClassData();
            checkHashAndLaunch();
        };
    </script>
</body>
